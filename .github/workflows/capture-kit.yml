name: Capture kit

# Builds the volunteer capture kit and publishes it to a rolling "capture-kit" pre-release, so the download
# link never changes: https://github.com/<owner>/<repo>/releases/download/capture-kit/LockpickCapture.zip
on:
  push:
    branches: [main]
    paths:
      - 'src/Lockpick.Core/**'
      - 'src/Lockpick.Platform.Windows/**'
      - 'src/Lockpick.GameAdapter.RE1/**'
      - 'data/games/**'
      - 'tools/Lockpick.Probe/**'
      - 'tools/capture-kit/**'
      - '.github/workflows/capture-kit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-kit
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Lockpick.Tests -c Release

      - name: Build kit
        shell: pwsh
        run: ./tools/capture-kit/build-capture-kit.ps1 -ZipName LockpickCapture.zip

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $notes = @"
          **Lockpick Capture kit** — helps Lockpick learn Resident Evil by recording game state while you play.
          Download **LockpickCapture.zip**, unzip, start the game normally, double-click ``LockpickCapture.exe``.
          Full instructions are in the README inside the zip and in [docs/CAPTURE.md](https://github.com/${{ github.repository }}/blob/main/docs/CAPTURE.md).

          Read-only (like a LiveSplit autosplitter), records no personal information. Built from $sha.
          "@
          git tag -f capture-kit
          git push -f origin refs/tags/capture-kit
          gh release view capture-kit *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create capture-kit --prerelease --title "Capture kit (latest)" --notes $notes
          } else {
            gh release edit capture-kit --notes $notes
          }
          gh release upload capture-kit artifacts/LockpickCapture.zip --clobber
